name: Neardock Windows and Android builds
# Windows ARM64 is unavailable with this pinned SDK: the official setup action
# cannot resolve a Windows ARM64 Flutter 3.41.9 archive. Do not substitute an x64
# binary or upgrade the SDK silently. Reintroduce the native target after review.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  FLUTTER_VERSION: '3.41.9'
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Prepare Windows share helper
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/10.*/x64/makepri.exe' | Sort-Object FullName | Select-Object -Last 1
          if (!$sdkBin) { throw 'Windows SDK resource tools unavailable' }
          & $sdkBin.FullName new /pr support/build/msix/content /cf support/build/msix/priconfig.xml /mn support/build/msix/content/AppxManifest.xml /of support/build/msix/content/resources.pri /o
          if ($LASTEXITCODE -ne 0) { throw 'Resource packaging failed' }
          & (Join-Path $sdkBin.Directory.FullName 'makeappx.exe') pack /o /d support/build/msix/content /nv /p app/windows/neardock_msix_helper.msix
          if ($LASTEXITCODE -ne 0) { throw 'MSIX helper packaging failed' }
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Build Windows
        working-directory: app
        run: flutter build windows --release
      - name: Install installer compiler
        if: matrix.arch == 'x64'
        run: choco install innosetup --no-progress -y
      - name: Package Windows
        shell: pwsh
        run: ./support/neardock/package_windows.ps1 -Architecture ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: neardock-windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Restore Neardock signing identity
        env:
          KEYSTORE: ${{ secrets.NEARDOCK_ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.NEARDOCK_ANDROID_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/neardock.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=neardock\n' "$RUNNER_TEMP/neardock.jks" "$PASSWORD" "$PASSWORD" > app/android/key.properties
      - name: Preserve upstream APK donation link behaviour
        run: sh support/scripts/remove_proprietary_dependencies.sh
      - name: Build Android APKs
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
      - name: Package Android
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Neardock-1.0.0-android-arm32.apk
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Neardock-1.0.0-android-arm64.apk
          cp app/build/app/outputs/flutter-apk/app-x86_64-release.apk dist/Neardock-1.0.0-android-x64.apk
      - uses: actions/upload-artifact@v6
        with:
          name: neardock-android
          path: dist/*.apk
          if-no-files-found: error
