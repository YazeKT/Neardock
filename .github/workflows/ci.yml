name: CI

on:
  push:
    branches: [neardock]
  pull_request:
    branches: [neardock]

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get
      - name: Dependencies (cargokit - rust_builder)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get
      - name: Remove gen directory (app)
        working-directory: app
        run: rm -rf lib/gen
      - name: Check format (app)
        working-directory: app
        run: dart format --set-exit-if-changed lib test

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get
      - name: Dependencies (cargokit - rust_builder)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get
      - name: Analyze (app)
        working-directory: app
        run: flutter analyze
      - name: Test (app)
        working-directory: app
        run: flutter test
      - name: Dependencies (localsend_isolates)
        working-directory: packages/localsend_isolates
        run: flutter pub get
      - name: Test (localsend_isolates)
        working-directory: packages/localsend_isolates
        run: flutter test

  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust
        run: rustup toolchain install --profile minimal # version from rust-toolchain.toml
      - name: Cache
        uses: Swatinem/rust-cache@v2

      # `cargo fmt --check` is deliberately left out: the tree is not
      # rustfmt-clean today, and `frb_generated.rs` never will be.
      #
      # `packages/core` declares its modules unconditionally while their
      # dependencies are optional, so it only builds with a feature set that
      # pulls all of them in.
      - name: Clippy (core)
        working-directory: packages/core
        run: cargo clippy --features full --all-targets
      - name: Test (core)
        working-directory: packages/core
        run: cargo test --features full
      - name: Test (signaling server)
        run: cargo test --package server
      - name: Check (plugin crate)
        run: cargo check --package rust_lib_localsend_app

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check Neardock identity and release metadata
        run: python3 support/neardock/check_release.py
